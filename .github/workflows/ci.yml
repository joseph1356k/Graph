name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Lint, typecheck y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Los navegadores de Playwright no hacen falta: la suite corre con fakes
      # en memoria y no lanza un navegador real.
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  miracle-ai:
    name: Runtime Python (bounded/miracle-ai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bounded/miracle-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar el paquete + deps de dev
        run: pip install -e ".[dev]"

      - name: Compilar todo el runtime (atrapa SyntaxError antes de deploy)
        run: python -m compileall -q src

      - name: Tests
        run: pytest
