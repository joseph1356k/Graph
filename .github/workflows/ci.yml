# ---------------------------------------------------------------------------
# Ejecuta los 16 revisores de scripts/verify-*.js en cada cambio.
#
# Este archivo SOLO revisa e informa. Nunca bloquea por si mismo.
# El bloqueo se configura aparte, en Settings > Branches de GitHub,
# y es ahi donde viven los dos puentes de emergencia.
# ---------------------------------------------------------------------------

name: Portero

on:
  # 1. Cuando alguien propone un cambio (Pull Request).
  pull_request:

  # 2. Cuando alguien sube a CUALQUIER rama, incluida main.
  #    Sin lista de ramas = todas.
  #
  #    Esto es lo que sostiene el modelo: nunca hay que pedir permiso ni
  #    configurar nada. Trabajes donde trabajes, el portero revisa y avisa.
  #    Y si se sube directo a main saltandose todo, tambien revisa: no
  #    detiene a nadie, pero deja el reporte de que entro.
  push:

  # 3. Boton manual, por si alguien quiere correrlo cuando quiera.
  workflow_dispatch:

# Si se suben dos cambios seguidos a la misma rama, cancela el anterior
# y revisa solo el ultimo. Evita gastar minutos de GitHub sin necesidad.
concurrency:
  group: portero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisores:
    name: 16 revisores
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Postgres de usar y tirar. Sin esto, verify-note-exports-db.js se salta solo
    # ("no hay cliente psql instalado") y ese pedazo no lo revisa nadie, ni en tu
    # Mac ni aqui. GitHub lo levanta gratis en un contenedor.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graph_note_exports_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Descarga el codigo del repositorio en la maquina prestada.
      - name: Traer el codigo
        uses: actions/checkout@v4

      # Instala Node. La version 22 es LTS (soporte largo).
      # 'cache: npm' guarda las dependencias entre corridas para ir mas rapido.
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Instala exactamente lo que dice package-lock.json.
      - name: Instalar dependencias
        run: npm ci

      # El mismo comando que corriste en tu terminal.
      # GRAPH_TEST_DATABASE_URL hace que verify-note-exports-db.js SI corra,
      # en vez de saltarse.
      - name: Correr los 16 revisores
        env:
          GRAPH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/graph_note_exports_it
        run: npm test
